<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GoGuide · 任务式导购演示</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#1c2930;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#12362f;color:#fff;padding:22px max(24px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px}.brand small{font-size:12px;font-weight:400;display:block;letter-spacing:1px;color:#b8d5c8}.badge{border:1px solid #7fa493;border-radius:999px;padding:7px 12px;font-size:12px;color:#d5e7df}main{max-width:1200px;margin:auto;padding:28px 24px 60px}.intro{background:linear-gradient(120deg,#d8f0e2,#f7faf6);padding:30px;border-radius:18px;margin-bottom:22px}.intro h1{margin:0 0 8px;font-size:31px}.intro p{margin:0;color:#4f665b;line-height:1.7}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button{border:0;background:#e4ece7;color:#244438}.tabs button.active{background:#164936;color:#fff}button{border:0;border-radius:9px;padding:10px 15px;background:#1d684c;color:white;cursor:pointer;font-weight:600}button.secondary{background:#e6eee9;color:#214636}button.danger{background:#a5413d}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{border:1px solid #c8d7cd;border-radius:8px;padding:10px;background:white;color:#203b2e;font:inherit}input,select{max-width:100%}textarea{width:100%;min-height:92px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:#fff;border:1px solid #e0e9e2;border-radius:14px;padding:21px;margin:16px 0;box-shadow:0 6px 24px #163c2310}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}.card{border:1px solid #dfe9e1;border-radius:12px;padding:17px;background:#fff}.card h3{margin:7px 0;font-size:18px}.card p{font-size:13px;color:#5b6e63;line-height:1.5}.meta{font-size:12px;color:#718477}.price{font-size:21px;color:#aa4b26;font-weight:800;margin:10px 0}.tag{display:inline-block;background:#e4f0e8;color:#27644b;font-size:11px;border-radius:5px;padding:4px 6px;margin:2px}.error{color:#a52f2f}.muted{color:#718477;font-size:13px}.notice{background:#fff8e8;color:#806126;border:1px solid #f1dfb0;border-radius:8px;padding:10px 14px;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none}.list{border-top:1px solid #e7eee8;padding:13px 0}.message{padding:13px;border-radius:10px;background:#f0f5f1;margin:9px 0;line-height:1.6}.message.user{background:#e4f0e9}.stat{font-size:12px;color:#5a7967}pre{white-space:pre-wrap;word-break:break-all}@media(max-width:760px){.split{grid-template-columns:1fr}header{padding:18px 22px}.intro h1{font-size:25px}}
  </style>
</head>
<body>
<header><div class="brand">GoGuide<small>GO + AGENT SHOPPING LAB</small></div><div class="badge">本地演示商城 · 非真实购买</div></header>
<main>
  <div class="intro"><h1>从一句需求，到可核验的购物方案</h1><p>先理解用途和预算，再检查商品事实、总价与设备兼容性。库存和价格由本地 Go 后端管理，支付仅用于模拟交易流程。</p></div>
  <div class="tabs"><button data-tab="products" class="active">商品</button><button data-tab="guide">智能导购</button><button data-tab="cart">购物车</button><button data-tab="orders">订单</button><button data-tab="account">账号与地址</button><button data-tab="admin" id="adminTab" class="hidden">管理演示</button></div>
  <div id="flash"></div>
  <section id="products" class="view"><div class="panel"><div class="row"><input id="query" placeholder="搜索商品或参数" /><select id="category"><option value="">全部品类</option><option value="laptop">笔记本</option><option value="monitor">显示器</option><option value="dock">扩展坞</option></select><label><input type="checkbox" id="stockOnly" checked /> 仅看有货</label><button onclick="loadProducts()">搜索</button></div></div><div id="productList" class="grid"></div></section>
  <section id="guide" class="view hidden"><div class="panel"><h2>描述你的购物任务</h2><p class="muted">例如：预算 8000 元，买笔记本和显示器，最好一根线连接。方案会标出商品依据，确认后才加购。</p><textarea id="guideText" placeholder="用途、预算、必需条件与偏好……"></textarea><div class="row"><button onclick="sendGuide()">生成或调整方案</button><span id="guideStatus" class="stat"></span></div></div><div id="guideMessages"></div><div id="proposalList" class="grid"></div></section>
  <section id="cart" class="view hidden"><div class="panel"><h2>购物车</h2><div id="cartList"></div><div class="row"><strong id="cartTotal"></strong><select id="checkoutAddress"></select><button onclick="previewOrder()">预览订单</button></div><div id="previewBox"></div></div></section>
  <section id="orders" class="view hidden"><div class="panel"><h2>我的订单</h2><div id="orderList"></div></div></section>
  <section id="account" class="view hidden"><div class="split"><div class="panel"><h2>登录 / 注册</h2><div class="row"><input id="email" type="email" placeholder="邮箱" /><input id="password" type="password" placeholder="密码（至少 8 位）" /></div><div class="row" style="margin-top:12px"><button onclick="auth('login')">登录</button><button class="secondary" onclick="auth('register')">注册</button><button class="secondary" onclick="logout()">退出</button></div><p id="accountState" class="muted"></p></div><div class="panel"><h2>收货地址</h2><div class="row"><input id="recipient" placeholder="收件人" /><input id="phone" placeholder="电话" /><input id="detail" placeholder="详细地址" style="min-width:240px"/><button onclick="addAddress()">保存地址</button></div><div id="addressList"></div></div></div></section>
  <section id="admin" class="view hidden"><div class="panel"><h2>价格与可售库存</h2><p class="muted">仅管理员可操作。每次修改需要原因；已预占库存不会被直接覆盖。</p><div class="row"><input id="adminSku" type="number" min="1" placeholder="SKU ID" /><input id="adminPrice" type="number" min="0" step="0.01" placeholder="新价格（元）" /><input id="adminDelta" type="number" placeholder="库存增减量，如 -1" /><input id="adminReason" placeholder="修改原因" /></div><div class="row" style="margin-top:12px"><button onclick="setAdminPrice()">修改价格</button><button class="secondary" onclick="setAdminStock()">调整库存</button></div></div></section>
  <p class="notice">所有商品、价格、库存及支付均为本地演示数据；没有真实淘宝订单、付款或发货。</p>
</main>
<script>
let token=localStorage.getItem('goguide_token')||'',sessionId='',intentVersion=1,preview=null,role='user';
const $=id=>document.getElementById(id),money=n=>'¥'+(Number(n||0)/100).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(text,bad=false){$('flash').innerHTML='<div class="panel '+(bad?'error':'')+'">'+esc(text)+'</div>';setTimeout(()=>$('flash').innerHTML='',6000)}
async function call(path,method='GET',body){if(location.protocol==='file:')throw Error('请启动 GoGuide API，并通过 http://127.0.0.1:8080/ 打开页面');const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;let r;try{r=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}catch(e){throw Error('无法连接 GoGuide API。请确认服务已启动，并通过 http://127.0.0.1:8080/ 访问页面')}let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error?.message||data.error?.code||'请求失败');return data}
function show(tab){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==tab));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='products')loadProducts();if(tab==='cart')loadCart();if(tab==='orders')loadOrders();if(tab==='account')loadAddresses()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
async function loadProducts(){try{let q=new URLSearchParams({q:$('query').value,category:$('category').value,in_stock:$('stockOnly').checked});let data=await call('/v1/products?'+q);$('productList').innerHTML=data.items.map(s=>`<div class="card"><span class="tag">${esc(s.category)}</span><h3>${esc(s.title)}</h3><div class="meta">${esc(s.brand)} · ${esc(s.label)} · SKU ${s.id}</div><p>${esc(s.description)}</p><div class="price">${money(s.price_cents)}</div><p>可售 ${s.available} · ${esc(s.source_kind)} 数据</p><button onclick="addCart(${s.id})">加入购物车</button></div>`).join('')||'<div class="panel">没有找到商品</div>'}catch(e){flash(e.message,true)}}
async function addCart(id){try{await call('/v1/cart/items','POST',{sku_id:id,quantity:1});flash('已加入购物车')}catch(e){flash(e.message,true)}}
async function auth(kind){try{let data=await call('/v1/auth/'+kind,'POST',{email:$('email').value,password:$('password').value});token=data.token;role=data.role||'user';localStorage.setItem('goguide_token',token);$('accountState').textContent='已登录：'+$('email').value;$('adminTab').classList.toggle('hidden',role!=='admin');flash('登录成功');loadAddresses()}catch(e){flash(e.message,true)}}
async function logout(){try{if(token)await call('/v1/auth/logout','POST',{})}catch(e){}token='';role='user';localStorage.removeItem('goguide_token');$('adminTab').classList.add('hidden');$('accountState').textContent='未登录';flash('已退出')}
async function refreshMe(){if(!token)return;try{let me=await call('/v1/me');role=me.role;$('adminTab').classList.toggle('hidden',role!=='admin');$('accountState').textContent='已登录：'+me.email}catch(e){token='';localStorage.removeItem('goguide_token')}}
async function setAdminPrice(){try{let id=Number($('adminSku').value),price_cents=Math.round(Number($('adminPrice').value)*100);await call('/v1/admin/skus/'+id+'/price','PUT',{price_cents,reason:$('adminReason').value});flash('价格已更新，旧预览将在下单时被拒绝');loadProducts()}catch(e){flash(e.message,true)}}
async function setAdminStock(){try{let id=Number($('adminSku').value),delta=Number($('adminDelta').value);await call('/v1/admin/skus/'+id+'/stock','PUT',{delta,reason:$('adminReason').value,request_id:crypto.randomUUID()});flash('可售库存已调整');loadProducts()}catch(e){flash(e.message,true)}}
async function loadAddresses(){if(!token){$('addressList').innerHTML='<p class="muted">请先登录</p>';return}try{let data=await call('/v1/addresses');$('addressList').innerHTML=data.items.map(a=>`<div class="list">${esc(a.recipient)} · ${esc(a.phone)} · ${esc(a.detail)}</div>`).join('')||'<p class="muted">暂无地址</p>';$('checkoutAddress').innerHTML=data.items.map(a=>`<option value="${a.id}">${esc(a.recipient)} · ${esc(a.detail)}</option>`).join('')}catch(e){flash(e.message,true)}}
async function addAddress(){try{await call('/v1/addresses','POST',{recipient:$('recipient').value,phone:$('phone').value,detail:$('detail').value,default:true});flash('地址已保存');loadAddresses()}catch(e){flash(e.message,true)}}
async function loadCart(){if(!token){$('cartList').textContent='请先登录';return}try{let data=await call('/v1/cart');$('cartList').innerHTML=data.items.map(it=>`<div class="list row"><label><input type="checkbox" ${it.selected?'checked':''} onchange="changeCart(${it.sku_id},${it.quantity},this.checked)"/> ${esc(it.title)} ${esc(it.label)}</label><input type="number" min="1" max="99" value="${it.quantity}" style="width:72px" onchange="changeCart(${it.sku_id},Number(this.value),${it.selected})"/><span>${money(it.line_cents)}</span><span class="error">${esc(it.warning||'')}</span><button class="secondary" onclick="removeCart(${it.sku_id})">删除</button></div>`).join('')||'<p class="muted">购物车为空</p>';$('cartTotal').textContent='预计合计：'+money(data.selected_estimate_cents);loadAddresses()}catch(e){flash(e.message,true)}}
async function changeCart(id,quantity,selected){try{await call('/v1/cart/items/'+id,'PUT',{quantity,selected});loadCart()}catch(e){flash(e.message,true)}}
async function removeCart(id){try{await call('/v1/cart/items/'+id,'DELETE');loadCart()}catch(e){flash(e.message,true)}}
async function previewOrder(){try{let address_id=Number($('checkoutAddress').value);preview=await call('/v1/orders/preview','POST',{address_id});$('previewBox').innerHTML=`<div class="panel"><h3>订单预览</h3><p>${preview.items.map(x=>esc(x.title)+' × '+x.quantity).join('、')}</p><strong>${money(preview.amount_cents)}</strong><p class="muted">有效至 ${esc(preview.expires_at)}</p><button onclick="submitOrder()">确认下单并预占库存</button></div>`}catch(e){flash(e.message,true)}}
async function submitOrder(){try{let data=await call('/v1/orders','POST',{preview_id:preview.preview_id,request_id:crypto.randomUUID()});flash('订单已创建：'+data.order_id);show('orders')}catch(e){flash(e.message,true)}}
async function loadOrders(){if(!token){$('orderList').textContent='请先登录';return}try{let data=await call('/v1/orders');$('orderList').innerHTML=data.items.map(o=>`<div class="list row"><strong>${esc(o.id)}</strong><span class="tag">${esc(o.status)}</span><span>${money(o.amount_cents)}</span>${o.status==='PENDING_PAYMENT'?`<button onclick="pay('${esc(o.id)}')">模拟支付</button><button class="secondary" onclick="cancel('${esc(o.id)}')">取消</button>`:''}</div>`).join('')||'<p class="muted">暂无订单</p>'}catch(e){flash(e.message,true)}}
async function pay(id){try{await call('/v1/orders/'+id+'/mock-pay','POST',{});flash('模拟支付成功');loadOrders()}catch(e){flash(e.message,true);loadOrders()}}
async function cancel(id){try{await call('/v1/orders/'+id+'/cancel','POST',{});flash('订单已取消');loadOrders()}catch(e){flash(e.message,true)}}
async function sendGuide(){if(!token){flash('请先登录',true);show('account');return}try{if(!sessionId){let d=await call('/v1/guide/sessions','POST',{});sessionId=d.session_id;intentVersion=d.intent_version}let text=$('guideText').value.trim();if(!text)return;$('guideStatus').textContent='大模型解析需求并校验商品中…';let d=await call('/v1/guide/sessions/'+sessionId+'/messages','POST',{text,expected_version:intentVersion});intentVersion=d.intent_version;$('guideMessages').innerHTML+=`<div class="message user">${esc(text)}</div><div class="message">${esc(d.question||d.message)}</div>`;$('guideText').value='';$('guideStatus').textContent='大模型已解析 · 会话版本 '+intentVersion;$('proposalList').innerHTML=(d.proposals||[]).map(p=>`<div class="card"><span class="tag">方案 v${p.version}</span><h3>${money(p.amount_cents)}</h3><p>预算余额 ${money(p.budget_left_cents)}</p><p>${p.items.map(i=>esc(i.title)+' '+esc(i.label)).join('<br/>')}</p><p class="stat">${esc(p.compatibility.status)}：${esc(p.compatibility.reasons.join('；'))}</p><p class="muted">价格和库存将在加购、下单时复核</p><button onclick="confirmPlan('${p.id}',${p.version},${p.amount_cents})">确认加购</button></div>`).join('')||'';window.latestPlans=d.proposals||[]}catch(e){$('guideStatus').textContent=e.message;flash(e.message,true)}}
async function confirmPlan(id,version,amount){let p=(window.latestPlans||[]).find(x=>x.id===id);if(!p)return;try{await call('/v1/guide/proposals/'+id+'/confirm','POST',{proposal_version:version,expected_amount_cents:amount,items:p.items.map(i=>({sku_id:i.sku_id,quantity:i.quantity}))});flash('方案已加购，请在购物车单独确认订单');show('cart')}catch(e){flash(e.message,true)}}
loadProducts();$('accountState').textContent=token?'已有登录令牌':'未登录';refreshMe();
</script>
</body></html>
